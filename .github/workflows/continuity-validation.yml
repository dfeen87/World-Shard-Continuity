name: Continuity Validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-continuity:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run continuity validator
        run: npm run validate -- --root examples/fixtures --json
